[derived_reference_policy]
# Sequence-Role values (from the assembly report) included when
# Assembly-Unit == "Primary Assembly".
include_sequence_roles_primary_assembly = ["assembled-molecule", "unlocalized-scaffold", "unplaced-scaffold"]
# Plus the mitochondrial assembled-molecule from the "non-nuclear" unit.
include_non_nuclear_assembled_molecule = true
# Preserve the source accession as the FASTA identifier: RefSeq when
# present, otherwise GenBank. Never rename to a convenience alias.
accession_preference = ["refseq", "genbank"]
