# Task 002C-R3–R5 versioned configuration (components-v2 end-to-end split).
#
# docs/tasks/002c_r3_r5_end_to_end_v2_execution.md and its plan acceptance
# (docs/reviews/002c_r3_r5_end_to_end_v2_execution_plan_acceptance.md).
#
# Every value here is ALSO a reviewed code constant in
# src/rbpbench/splits/r3r5/contract.py.  The production loader refuses this
# file unless every field equals that constant, so editing this file can
# never change the executed contract silently.  The MMseqs2 scientific flags
# (identity, coverage, cov-mode, --max-seqs, search type, strand, alignment
# mode, E-value, masking, sensitivity) are deliberately NOT configurable
# here: they remain hard-coded in rbpbench.splits.commands.

