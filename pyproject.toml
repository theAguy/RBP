[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbpbench"
version = "0.1.0"
description = "Reproducible validation of multi-protein RNA-binding predictors"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rbp-audit = "rbpbench.data.audit:main"

[tool.setuptools.packages.find]
where = ["src"]
