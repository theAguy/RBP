[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbpbench"
version = "0.1.0"
description = "Reproducible validation of multi-protein RNA-binding predictors"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
rbp-audit = "rbpbench.data.audit:main"
rbp-coordinates = "rbpbench.coordinates.runner:main"
rbp-splits = "rbpbench.splits.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
