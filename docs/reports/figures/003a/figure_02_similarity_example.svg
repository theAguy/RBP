			<text x="28" y="598" style="font-family: Helvetica; font-size: 9px;fill: rgb(46%,46%,46%); stroke:none;" transform="translate(0,1196) scale(1,-1)">The rule compares aligned nucleotide order on both strands; it is not a count of A/C/G/T composition</text>
