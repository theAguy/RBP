			<text x="33.95349999999999" y="45" style="font-family: Helvetica-Bold; font-size: 9px;fill: rgb(13%,13%,13%); stroke:none;" transform="translate(0,90) scale(1,-1)">A and B enter the same connected component and must receive the same partition.</text>
			<text x="455" y="125" style="font-family: Helvetica; font-size: 9px;fill: rgb(13%,13%,13%); stroke:none;" transform="translate(0,250) scale(1,-1)">Both strands: the search also checks the reverse complement, so a reversed</text>
			<text x="455" y="113.75" style="font-family: Helvetica; font-size: 9px;fill: rgb(13%,13%,13%); stroke:none;" transform="translate(0,227) scale(1,-1)">complementary copy is still recognized. Connected components are transitive: a pair</text>
			<text x="455" y="102.5" style="font-family: Helvetica; font-size: 9px;fill: rgb(13%,13%,13%); stroke:none;" transform="translate(0,205) scale(1,-1)">with no direct edge can still belong together if a path through other windows connects</text>
