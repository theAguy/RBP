# Frozen Task 002 sequence-partition configuration (docs/tasks/002_sequence_clustered_partitions.md,
# docs/tasks/002b_real_sequence_grouping.md, docs/DECISIONS.md 2026-09-25).
#
# This file records already-accepted scientific parameters, fixed real-input
# expectations, the assignment seed, resource limits, and the protected
# widths for provenance/manifest purposes. It is NOT a source of scientific
# overrides: `rbpbench.splits.commands` hardcodes the frozen identity/coverage/
# max-seqs values and accepts no caller-configurable identity or coverage
# argument, so nothing in this file (or on the runner CLI) can change them.

seed = 20260925
protected_widths = [500, 251, 101]

[dataset]
# Real dataset expectations (docs/tasks/002b_real_sequence_grouping.md,
# "Frozen inputs and scientific rule"). A tiny-fixture test run supplies its
# own separate config with the fixture's own hashes; these values are never
# used or reachable outside a real invocation naming this exact file.
csv_filename = "dataset_K562_multilabel_with_NEGs.csv"
csv_sha256 = "982c812631ce277ea95e10bd591b6d77b66bf3a8ed71b4120f1d65854107a945"
csv_byte_size = 724425277
expected_row_count = 361180
audit_json_path = "manifests/dataset_audit.json"
audit_json_sha256 = "e53e02c665f90021974471bf8972bcf8d6fd384f9439f4d630e68773be856b5c"
proteins_tsv_path = "configs/proteins.tsv"
proteins_tsv_sha256 = "374e09ea1a32e8bd335ad25b57e189c08a537c4edee8700d533d95e87eaadad9"

[resources]
# Task 002B-1 handoff / reconciliation (docs/reviews/002b_real_sequence_grouping_reconciliation.md).
max_threads = 4
timeout_seconds = 43200          # 12 hours, per full clustering invocation
max_new_disk_gib = 50.0          # combined new-artifact ceiling
min_free_disk_gib = 80.0         # free-disk floor before any real stage
#
# `mmseqs_split_memory_limit` is intentionally ABSENT: the 002B-1 real-binary
# split-memory-limit gate (tests/test_splits_split_memory_gate.py) proved that
# the candidate production value (8G) fails closed even on a tiny synthetic
# fixture with the frozen `-s 7.5` sensitivity setting on the pinned 16-GiB
# host ("Cannot fit databases into 7G. Please use a computer with more main
# memory."), and that no split-memory-limit value below the ~9.1-GiB fixed
# per-split floor observed on this host completes at all -- so a genuine
# forced multi-way split can never be safely demonstrated here (a second
# split would need materially more than the 16 GiB physically installed).
# Per docs/reviews/002b_real_sequence_grouping_reconciliation.md ("If
# equivalence or actual forced splitting cannot be demonstrated, the 8-GiB
# flag is removed before real execution"), the flag is removed. The 002B-3
# resource-probe stop boundary (10-GiB probe peak / 10-GiB available memory)
# remains the sole real-run memory safeguard.

[probe]
sample_size = 10000
max_peak_memory_gib = 10.0
min_available_memory_gib_before_next_stage = 10.0

[gate]
# rbpbench.splits.audit already hardcodes these; recorded here only for
# manifest/report readability.
giant_single_component_fraction = 0.05
giant_top20_fraction = 0.20
